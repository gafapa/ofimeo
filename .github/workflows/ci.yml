name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      # The pinned draw.io release the shape libraries are generated from.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/draw-*.war
          key: drawio-war-${{ hashFiles('scripts/drawio.json') }}
      # Fails when a production dependency has no license (also run by the build).
      - name: Third-party licenses
        run: node scripts/third-party-notices.mjs --check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (grammar, permissions and storage)
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  relay:
    name: Relay (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Built only (never pushed), to catch breakage of the Dockerfile.
      - name: Build the image
        run: docker build --build-arg VERSION=ci -t ofimeo:ci .
      - name: Start it and check the app, the school configuration and the health check
        run: |
          mkdir -p ci-config
          echo '{"school":{"name":"CI school"},"locked":["webmcp"]}' > ci-config/ofimeo.config.json
          docker run -d --name ofimeo -p 8443:8443 -v "$PWD/ci-config:/config:ro" -e OFIMEO_HOST=127.0.0.1 ofimeo:ci
          for i in $(seq 1 30); do curl -skf https://127.0.0.1:8443/ofimeo/status.json > /dev/null && break; sleep 2; done
          curl -skf https://127.0.0.1:8443/ | grep -q 'name="ofimeo-relay"'
          curl -skf https://127.0.0.1:8443/ofimeo.config.json | grep -q 'CI school'
          curl -skf https://127.0.0.1:8443/ofimeo/config | grep -q 'CI school'
          docker exec ofimeo /ofimeo-relay healthcheck
      - name: Container log
        if: always()
        run: docker logs ofimeo || true
