# Ofimeo as static files with nginx (docs/deploy-school.md, "Static hosting").
#   1. Copy dist/ (npm run build) to /var/www/ofimeo; the school configuration
#      goes in /var/www/ofimeo/ofimeo.config.json (logo in /var/www/ofimeo/school/).
#   2. Copy this file and ofimeo-headers.inc to /etc/nginx/conf.d/ (the .inc
#      name keeps nginx from loading it on its own),
#      adjust server_name and the certificate, then: nginx -t && systemctl reload nginx

server {
    listen 443 ssl;
    http2 on;
    server_name ofimeo.school.example;
    ssl_certificate     /etc/ssl/ofimeo/fullchain.pem;
    ssl_certificate_key /etc/ssl/ofimeo/privkey.pem;

    root /var/www/ofimeo;
    index index.html;

    # Types an older mime.types may lack.
    types {
        text/html                  html;
        text/css                   css;
        text/javascript            js mjs;
        application/json           json;
        application/wasm           wasm;
        application/manifest+json  webmanifest;
        image/svg+xml              svg;
        image/png                  png;
        image/x-icon               ico;
        font/woff2                 woff2;
        font/woff                  woff;
        font/ttf                   ttf;
        application/xml            xml;
        text/plain                 txt;
        application/pdf            pdf;
    }

    include /etc/nginx/conf.d/ofimeo-headers.inc;

    # Revalidated so updates reach browsers: the page, the service worker, the
    # manifest and the school configuration (and its logo).
    location ~ ^/(index\.html|sw\.js|ofimeo\.config\.json|manifest\.webmanifest)$ {
        include /etc/nginx/conf.d/ofimeo-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location /school/ {
        include /etc/nginx/conf.d/ofimeo-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    # Content-hashed files never change.
    location /assets/ {
        include /etc/nginx/conf.d/ofimeo-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # Routing is in the URL fragment (#app=…): no rewrite to index.html is
    # needed, and unknown paths are real 404s.
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name ofimeo.school.example;
    return 301 https://$host$request_uri;
}
