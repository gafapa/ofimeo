version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tiptap:
        patterns: ['@tiptap/*']
      univer:
        patterns: ['@univerjs/*']
  - package-ecosystem: gomod
    directory: /relay
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Keep Node on the selected LTS major; review the next major explicitly.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
