# Ofimeo as static files with Apache httpd (docs/deploy-school.md, "Static hosting").
# Put these lines in the <VirtualHost *:443> of the site, or in a .htaccess
# file next to index.html (needs AllowOverride FileInfo Headers Indexes).
# Modules: mod_headers, mod_mime (a2enmod headers mime).

DirectoryIndex index.html

AddType application/wasm .wasm
AddType application/manifest+json .webmanifest
AddType font/woff2 .woff2
AddType font/woff .woff
AddType text/javascript .mjs

<IfModule mod_headers.c>
  # See deploy/nginx.conf for why each source is needed. No COOP/COEP.
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' data: blob: https: wss: ws:; worker-src 'self' blob:; media-src 'self' data: blob:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "no-referrer"

  # Revalidated: the page, the service worker, the manifest, the school configuration.
  <FilesMatch "^(index\.html|sw\.js|ofimeo\.config\.json|manifest\.webmanifest)$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
  # Content-hashed files (assets/) never change.
  <If "%{REQUEST_URI} =~ m#/assets/#">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </If>
</IfModule>
