# Nextcloud Apache image: allow only the two registered Ofimeo origins.
# Mount read-only at /etc/apache2/conf-enabled/ofimeo-cors.conf.
# Requires mod_headers, mod_setenvif and mod_rewrite. Ofimeo calls the Login
# Flow as /index.php/login/v2 (and /poll), which the patterns include.
SetEnvIf Origin "^https://(?:ofimeo[.]com|gafapa[.]github[.]io)$" OFIMEO_ORIGIN=$0

<LocationMatch "^/(?:remote[.]php/dav/|public[.]php/(?:dav|webdav)/|ocs/v2[.]php/core/apppassword(?:/|$)|(?:index[.]php/)?login/v2(?:/|$))">
  Header onsuccess unset Access-Control-Allow-Origin env=OFIMEO_ORIGIN
  Header always set Access-Control-Allow-Origin "%{OFIMEO_ORIGIN}e" env=OFIMEO_ORIGIN
  Header always set Access-Control-Allow-Methods "GET, HEAD, PROPFIND, PUT, MKCOL, DELETE, MOVE, POST, OPTIONS" env=OFIMEO_ORIGIN
  Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Depth, Destination, If-Match, If-None-Match, Overwrite, OCS-APIRequest, X-Requested-With" env=OFIMEO_ORIGIN
  Header always set Access-Control-Expose-Headers "ETag, OC-FileId, Content-Disposition, Last-Modified" env=OFIMEO_ORIGIN
  Header always merge Vary "Origin"
</LocationMatch>

RewriteEngine On
RewriteCond %{HTTP:Origin} ^https://(?:ofimeo[.]com|gafapa[.]github[.]io)$
RewriteCond %{REQUEST_METHOD} =OPTIONS
RewriteCond %{REQUEST_URI} ^/(?:remote[.]php/dav/|public[.]php/(?:dav|webdav)/|ocs/v2[.]php/core/apppassword(?:/|$)|(?:index[.]php/)?login/v2(?:/|$))
RewriteRule ^ - [R=204,L]
